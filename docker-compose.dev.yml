services:
  redis:
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"

  kafka:
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9094}:9094"
    environment:
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  kafka-connect:
    ports:
      - "${KAFKA_CONNECT_HOST_PORT:-8083}:8083"

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:${KAFKA_UI_VERSION:-latest}
    networks: [backend]
    ports:
      - "${KAFKA_UI_HOST_PORT:-8085}:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: fakegram-dev
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
    depends_on:
      kafka:
        condition: service_healthy

  migrate:
    build:
      target: migrator
    image: fakegram-backend-migrator:dev

  app:
    build:
      target: development
    image: fakegram-backend:dev
    command: ["npx", "nest", "start", "--watch", "--debug", "0.0.0.0:9229"]
    ports:
      - "${APP_HOST_PORT:-8080}:8080"
      - "${APP_DEBUG_PORT:-9229}:9229"
    environment:
      NODE_ENV: development
      MODE_ENV: dev
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: RecursiveDirectoryUsingDynamicPriorityPolling
    volumes:
      - ./src:/app/src
      - ./prisma/schema.prisma:/app/prisma/schema.prisma:ro
      - ./prisma/migrations:/app/prisma/migrations
      - ./prisma.config.ts:/app/prisma.config.ts:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./tsconfig.build.json:/app/tsconfig.build.json:ro
      - ./nest-cli.json:/app/nest-cli.json:ro
